name: Build Saku Final APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buat debug.keystore & Cek SHA-1
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== SALIN KODE SHA-1 DI BAWAH INI UNTUK FIREBASE ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1

      - name: Suntikkan API Key AI ke local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "GEMINI_API_KEY=$GEMINI_API_KEY" > local.properties

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Ganti Nama File APK
        run: |
          mkdir -p release_apk
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK_PATH" "release_apk/Saku-v1.0.${{ github.run_number }}.apk"

      - name: Rilis ke Menu Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Saku v1.0.${{ github.run_number }}
          files: release_apk/*.apk
